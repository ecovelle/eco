<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecovelle на Ozon — 2</title>

<!-- ============================================================
     НАСТРОЙКИ — здесь можно менять товар и счётчик Метрики
     ============================================================ -->
<script>
  // 1) Ссылка на ТВОЙ товар на Ozon (можно поменять на любой другой)
  var OZON_URL = "https://ozon.kz/product/gianna-kai-sumka-tout-shopper-5566518666/?from=share_web&perehod=smm_share_button_productpage_link&sh=Ntw4W_xCoQ&short=dwAVPPw";

  // 2) Название товара, которое видно на странице (можно поменять)
  var PRODUCT_NAME = "Gianna Kai — сумка тоут-шоппер";

  // 3) Номер счётчика Яндекс.Метрики (0 = выключен)
  var METRIKA_ID = 0;
</script>
<!-- ============================================================ -->

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(165deg, #00246b 0%, #0041c8 45%, #005bff 75%, #35a1ff 100%);
  }
  .wrap {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; border-radius: 24px;
    padding: 34px 26px 28px;
    max-width: 380px; width: 100%;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 20, 80, 0.35);
  }
  .logo {
    font-size: 30px; font-weight: 900; letter-spacing: 1px;
    color: #005bff; margin-bottom: 4px;
  }
  .product {
    font-size: 13px; color: #8a94a6;
    margin-bottom: 24px; line-height: 1.4;
  }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 22px;
    border: 4px solid #e3ecff;
    border-top-color: #005bff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 800; color: #001a34; margin: 0 0 8px; }
  p  { font-size: 14.5px; line-height: 1.5; color: #4d5a6e; margin: 0 0 22px; }
  .btn {
    display: block; text-decoration: none;
    background: #005bff; color: #fff;
    font-size: 17px; font-weight: 800;
    padding: 17px 20px; border-radius: 16px;
    box-shadow: 0 8px 22px rgba(0, 91, 255, 0.35);
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .hint {
    margin-top: 18px; font-size: 12.5px; color: #8a94a6; line-height: 1.5;
  }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">OZON</div>
      <div class="product" id="product"></div>
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Открываем товар…</h1>
      <p id="subtitle">Секунду — переносим вас в приложение Ozon.</p>
      <a class="btn" id="manualBtn" href="#">Открыть товар</a>
      <div class="hint" id="hint">А если у вас нет приложения Ozon — страница нашего товара просто откроется в браузере.</div>
    </div>
  </div>

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || "";
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/i.test(ua) && 'ontouchend' in document);
  var isInstagram = /instagram/i.test(ua);

  document.getElementById("product").textContent = PRODUCT_NAME;

  var path = OZON_URL.replace(/^https?:\/\//, "");

  // Android: intent:// принудительно открывает приложение Ozon.
  // Нет приложения — откроется сайт (browser_fallback_url).
  var androidIntent =
    "intent://" + path.split("#")[0] +
    "#Intent;scheme=https;package=ru.ozon.app.android;" +
    "S.browser_fallback_url=" + encodeURIComponent(OZON_URL) + ";end";

  var btn = document.getElementById("manualBtn");
  var title = document.getElementById("title");
  var subtitle = document.getElementById("subtitle");
  var spinner = document.getElementById("spinner");

  btn.setAttribute("href", isAndroid ? androidIntent : OZON_URL);

  // --- Яндекс.Метрика (работает, только если вписан METRIKA_ID) ---
  function initMetrika() {
    if (!METRIKA_ID) return;
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
    ym(METRIKA_ID, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true });
    try { ym(METRIKA_ID, "reachGoal", "ozon2_click"); } catch(e){}
  }
  initMetrika();

  function showButton() {
    if (document.hidden) return; // приложение уже открылось
    spinner.style.display = "none";
    title.textContent = "Товар ждёт вас!";
    subtitle.textContent = "Нажмите кнопку — откроется приложение Ozon с товаром.";
    btn.textContent = "Открыть в приложении Ozon";
    btn.classList.add("pulse");
  }

  if (isAndroid) {
    // В обычных браузерах пробуем авто-переход; внутри Instagram — нет
    // (на телефонах без приложения это даёт плашку об ошибке).
    if (!isInstagram) {
      setTimeout(function () { window.location.href = androidIntent; }, 300);
    }
    setTimeout(showButton, isInstagram ? 400 : 1300);

    // Страховка: если через 1.7 сек после нажатия приложение не открылось —
    // переводим человека на сайт.
    btn.addEventListener("click", function () {
      setTimeout(function () {
        if (!document.hidden) window.location.href = OZON_URL;
      }, 1700);
    });

  } else if (isIOS) {
    // iOS: приложение открывается только по нажатию человека (правило Apple)
    showButton();

  } else {
    // Компьютер: просто открываем сайт
    setTimeout(function () { window.location.href = OZON_URL; }, 400);
  }
})();
</script>
</body>
</html>
