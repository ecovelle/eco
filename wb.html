<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecovelle на Wildberries</title>

<!-- ============================================================
     НАСТРОЙКИ — здесь можно менять товар и счётчик Метрики
     ============================================================ -->
<script>
  // 1) Ссылка на ТВОЙ товар на Wildberries (можно поменять на любой другой)
  var WB_URL = "https://www.wildberries.ru/catalog/271132665/detail.aspx";

  // 2) Название товара, которое видно на странице (можно поменять)
  var PRODUCT_NAME = "Наш товар на Wildberries";

  // 3) Номер счётчика Яндекс.Метрики (0 = выключен)
  var METRIKA_ID = 0;
</script>
<!-- ============================================================ -->

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(165deg, #2b0a4d 0%, #6612b8 45%, #a11bd6 75%, #cb11ab 100%);
  }
  .wrap {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; border-radius: 24px;
    padding: 34px 26px 28px;
    max-width: 380px; width: 100%;
    text-align: center;
    box-shadow: 0 18px 50px rgba(45, 5, 80, 0.4);
  }
  .logo {
    font-size: 26px; font-weight: 900; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #7b2ff7, #cb11ab);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #7b2ff7;
    margin-bottom: 4px;
  }
  .product {
    font-size: 13px; color: #8a94a6;
    margin-bottom: 24px; line-height: 1.4;
  }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 22px;
    border: 4px solid #f0e4ff;
    border-top-color: #7b2ff7; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 800; color: #24003f; margin: 0 0 8px; }
  p  { font-size: 14.5px; line-height: 1.5; color: #5a4d6e; margin: 0 0 22px; }
  .btn {
    display: block; text-decoration: none;
    background: linear-gradient(90deg, #7b2ff7, #cb11ab); color: #fff;
    font-size: 17px; font-weight: 800;
    padding: 17px 20px; border-radius: 16px;
    box-shadow: 0 8px 22px rgba(123, 47, 247, 0.4);
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .hint {
    margin-top: 18px; font-size: 12.5px; color: #8a94a6; line-height: 1.5;
  }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">Wildberries</div>
      <div class="product" id="product"></div>
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Открываем товар…</h1>
      <p id="subtitle">Секунду — переносим вас в приложение Wildberries.</p>
      <a class="btn" id="manualBtn" href="#">Открыть товар</a>
      <div class="hint" id="hint">А если у вас нет приложения Wildberries — страница нашего товара просто откроется в браузере.</div>
    </div>
  </div>

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || "";
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/i.test(ua) && 'ontouchend' in document);
  var isInstagram = /instagram/i.test(ua);

  document.getElementById("product").textContent = PRODUCT_NAME;

  var path = WB_URL.replace(/^https?:\/\//, "");

  // Android: intent:// принудительно открывает приложение Wildberries.
  // Нет приложения — откроется сайт (browser_fallback_url).
  var androidIntent =
    "intent://" + path.split("#")[0] +
    "#Intent;scheme=https;package=com.wildberries.ru;" +
    "S.browser_fallback_url=" + encodeURIComponent(WB_URL) + ";end";

  var btn = document.getElementById("manualBtn");
  var title = document.getElementById("title");
  var subtitle = document.getElementById("subtitle");
  var spinner = document.getElementById("spinner");

  btn.setAttribute("href", isAndroid ? androidIntent : WB_URL);

  // --- Яндекс.Метрика (работает, только если вписан METRIKA_ID) ---
  function initMetrika() {
    if (!METRIKA_ID) return;
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
    ym(METRIKA_ID, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true });
    try { ym(METRIKA_ID, "reachGoal", "wb_click"); } catch(e){}
  }
  initMetrika();

  function showButton() {
    if (document.hidden) return; // приложение уже открылось
    spinner.style.display = "none";
    title.textContent = "Товар ждёт вас!";
    subtitle.textContent = "Нажмите кнопку — откроется приложение Wildberries с товаром.";
    btn.textContent = "Открыть в приложении WB";
    btn.classList.add("pulse");
  }

  if (isAndroid) {
    // В обычных браузерах пробуем авто-переход; внутри Instagram — нет
    // (на телефонах без приложения это даёт плашку об ошибке).
    if (!isInstagram) {
      setTimeout(function () { window.location.href = androidIntent; }, 300);
    }
    setTimeout(showButton, isInstagram ? 400 : 1300);

    // Страховка: если через 1.7 сек после нажатия приложение не открылось —
    // переводим человека на сайт.
    btn.addEventListener("click", function () {
      setTimeout(function () {
        if (!document.hidden) window.location.href = WB_URL;
      }, 1700);
    });

  } else if (isIOS) {
    // iOS: приложение открывается только по нажатию человека (правило Apple)
    showButton();

  } else {
    // Компьютер: просто открываем сайт
    setTimeout(function () { window.location.href = WB_URL; }, 400);
  }
})();
</script>
</body>
</html>
